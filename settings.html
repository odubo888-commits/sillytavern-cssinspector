<div class="css-class-inspector-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-crosshairs csi-title-icon"></i> CSS 元素检查器</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="csi_settings_card">
                <p class="csi_settings_intro">
                    将鼠标悬停在元素上即可查看标签、ID、类名和样式。点击可复制选择器。
                    使用悬浮按钮或快捷键可以开启、关闭检查器。
                </p>

                <label class="csi_set_row csi_set_toggle" for="css_inspector_enabled">
                    <span class="csi_set_text">
                        <span class="csi_set_label"><i class="fa-solid fa-eye"></i> 启用检查器</span>
                        <span class="csi_set_desc">显示悬浮检查按钮，并启用元素检查。</span>
                    </span>
                    <input id="css_inspector_enabled" type="checkbox" />
                </label>

                <div class="csi_settings_section">
                    <h4 class="csi_settings_heading">外观</h4>

                    <div class="csi_set_row">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-circle-half-stroke"></i> 提示框主题</span>
                            <span class="csi_set_desc">设置提示框和悬浮按钮的配色。</span>
                        </span>
                        <select id="css_inspector_theme" class="text_pole textarea_compact csi_set_control">
                            <option value="dark">深色</option>
                            <option value="light">浅色</option>
                        </select>
                    </div>

                    <div class="csi_set_row">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-copy"></i> 复制模式</span>
                            <span class="csi_set_desc">点击元素时要复制到剪贴板的内容。</span>
                        </span>
                        <select id="css_inspector_copy_mode" class="text_pole textarea_compact csi_set_control">
                            <option value="full">完整选择器</option>
                            <option value="classes">仅类名</option>
                            <option value="id">仅 ID</option>
                            <option value="path">完整 DOM 路径</option>
                            <option value="css">CSS 规则代码</option>
                        </select>
                    </div>
                </div>

                <div class="csi_settings_section">
                    <h4 class="csi_settings_heading">提示框内容</h4>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_dimensions">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-ruler-combined"></i> 显示尺寸</span>
                            <span class="csi_set_desc">显示元素的像素宽度和高度。</span>
                        </span>
                        <input id="css_inspector_show_dimensions" type="checkbox" />
                    </label>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_computed">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-palette"></i> 显示计算样式</span>
                            <span class="csi_set_desc">显示计算样式中的颜色、字体和背景。</span>
                        </span>
                        <input id="css_inspector_show_computed" type="checkbox" />
                    </label>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_vars">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-wand-magic-sparkles"></i> 显示 CSS 变量</span>
                            <span class="csi_set_desc">列出该元素使用的 CSS 自定义属性。</span>
                        </span>
                        <input id="css_inspector_show_vars" type="checkbox" />
                    </label>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_boxmodel">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-vector-square"></i> 显示盒模型</span>
                            <span class="csi_set_desc">高亮外边距和内边距，并显示盒模型数值。</span>
                        </span>
                        <input id="css_inspector_show_boxmodel" type="checkbox" />
                    </label>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_breadcrumbs">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-sitemap"></i> 显示层级导航</span>
                            <span class="csi_set_desc">固定提示框后，显示可点击的父级元素路径。</span>
                        </span>
                        <input id="css_inspector_show_breadcrumbs" type="checkbox" />
                    </label>
                </div>

                <div class="csi_settings_section">
                    <h4 class="csi_settings_heading">交互行为</h4>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_click_lock">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-thumbtack"></i> 点击固定提示框</span>
                            <span class="csi_set_desc">第一次点击固定提示框，再次点击复制内容。</span>
                        </span>
                        <input id="css_inspector_click_lock" type="checkbox" />
                    </label>

                    <label class="csi_set_row csi_set_toggle" for="css_inspector_show_toasts">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-bell"></i> 显示操作通知</span>
                            <span class="csi_set_desc">复制等操作时显示提示消息。</span>
                        </span>
                        <input id="css_inspector_show_toasts" type="checkbox" />
                    </label>
                </div>

                <div class="csi_settings_section">
                    <h4 class="csi_settings_heading">快捷键</h4>

                    <div class="csi_set_row csi_set_stack">
                        <span class="csi_set_text">
                            <span class="csi_set_label"><i class="fa-solid fa-keyboard"></i> 切换检查器快捷键</span>
                            <span class="csi_set_desc">点击输入框后按下快捷键组合，建议包含 Ctrl、Shift 或 Alt。</span>
                        </span>
                        <div class="csi_hotkey_controls">
                            <input id="css_inspector_hotkey_input" type="text" class="text_pole csi_hotkey_input"
                                   readonly placeholder="点击后按下快捷键…" />
                            <div id="css_inspector_hotkey_clear" class="menu_button menu_button_icon interactable" title="清除快捷键">
                                <i class="fa-solid fa-xmark"></i>
                            </div>
                            <div id="css_inspector_hotkey_reset" class="menu_button menu_button_icon interactable" title="恢复默认快捷键">
                                <i class="fa-solid fa-rotate-left"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="csi_settings_section">
                    <h4 class="csi_settings_heading">维护</h4>

                    <div id="css_inspector_reset_pos" class="csi_settings_primary interactable">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span>重置悬浮按钮位置</span>
                    </div>
                </div>

                <p class="csi_settings_footnote">
                    <i class="fa-solid fa-circle-info"></i>
                    点击提示框中的类名，可以高亮所有匹配元素。固定提示框后，
                    可以使用层级导航查看父级元素。
                </p>
            </div>

        </div>
    </div>
</div>
